<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>假設檢定動態演示：特異功能猜硬幣</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .coin-flip {
            animation: flip 0.6s ease-out;
        }
        @keyframes flip {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.2); }
            100% { transform: rotateY(360deg) scale(1); }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
        
        <!-- 標題 -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">🎯 假設檢定直覺演示：他有超能力嗎？</h1>
            <p class="text-xs text-slate-500 mt-1">虛無假設 (H₀)：他是盲猜的（每次猜對機率 50%）</p>
        </div>

        <!-- 硬幣動畫區 -->
        <div class="flex flex-col items-center justify-center my-6">
            <div id="coin" class="w-28 h-28 bg-amber-400 rounded-full border-4 border-amber-500 flex items-center justify-center shadow-lg text-amber-900 text-3xl font-black mb-4">
                🪙
            </div>
            <div class="flex gap-3">
                <button id="guessBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition active:scale-95 text-sm flex items-center gap-2">
                    <span>✨ 讓他再猜對一次</span>
                </button>
                <button id="resetBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 px-4 rounded-xl transition text-sm">
                    重置
                </button>
            </div>
        </div>

        <!-- 動態數據展示卡片 -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                <p class="text-xs text-slate-500 font-semibold">連續猜對次數</p>
                <p id="countText" class="text-3xl font-extrabold text-slate-800 mt-1">0 次</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                <p class="text-xs text-slate-500 font-semibold">盲猜發生的機率 (p值)</p>
                <p id="pValueText" class="text-3xl font-extrabold text-indigo-600 mt-1">100%</p>
            </div>
        </div>

        <!-- 判定結果警告框 -->
        <div id="verdictBox" class="bg-slate-100 p-4 rounded-xl border border-slate-300 text-center transition-all">
            <p id="verdictText" class="text-sm font-bold text-slate-600">
                👉 點擊按鈕開始測試，觀察「盲猜機率」的變化！
            </p>
        </div>

        <!-- 評分門檻說明 -->
        <div class="mt-6 pt-4 border-t border-slate-100 text-xs text-slate-500 space-y-1">
            <p>💡 <b>統計學門檻（α = 0.05）：</b></p>
            <p>當「純靠運氣盲猜」的機率小於 <b>5%</b> 時（連續猜對 5 次以上），我們就<b>拒絕 H₀</b>，認定他不是在盲猜！</p>
        </div>

    </div>

    <script>
        let count = 0;

        const coin = document.getElementById('coin');
        const guessBtn = document.getElementById('guessBtn');
        const resetBtn = document.getElementById('resetBtn');
        const countText = document.getElementById('countText');
        const pValueText = document.getElementById('pValueText');
        const verdictBox = document.getElementById('verdictBox');
        const verdictText = document.getElementById('verdictText');

        guessBtn.addEventListener('click', () => {
            // 硬幣翻轉動畫
            coin.classList.remove('coin-flip');
            void coin.offsetWidth; // 觸發重繪
            coin.classList.add('coin-flip');

            count++;
            let pValue = Math.pow(0.5, count);
            let pPercent = (pValue * 100).toFixed(2);

            countText.textContent = `${count} 次`;
            pValueText.textContent = `${pPercent}%`;

            if (pValue > 0.05) {
                verdictBox.className = "bg-amber-50 border border-amber-200 p-4 rounded-xl text-center";
                verdictText.innerHTML = `⚠️ <b>尚無法拒絕 H₀</b><br><span class="text-xs font-normal text-amber-700">連續猜對 ${count} 次的機率仍高於 5%，大家會覺得他只是幸運而已。</span>`;
            } else {
                verdictBox.className = "bg-emerald-100 border border-emerald-300 p-4 rounded-xl text-center shadow-inner";
                verdictText.innerHTML = `🎉 <b>拒絕 H₀！達到統計顯著（p = ${pPercent}% < 5%）</b><br><span class="text-xs font-normal text-emerald-800">純靠運氣猜對 ${count} 次的機率低於 5%！我們有信心認為他真的有超能力或有撇步！</span>`;
            }
        });

        resetBtn.addEventListener('click', () => {
            count = 0;
            countText.textContent = '0 次';
            pValueText.textContent = '100%';
            verdictBox.className = "bg-slate-100 p-4 rounded-xl border border-slate-300 text-center";
            verdictText.innerHTML = '👉 點擊按鈕開始測試，觀察「盲猜機率」的變化！';
        });
    </script>
</body>
</html>
