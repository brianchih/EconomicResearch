<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生全學期每週績效得分矩陣儀表板</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse (解析線上 CSV) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">

    <!-- 頂部標題列 -->
    <header class="bg-indigo-700 text-white py-6 shadow-md mb-6">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">學生學期每週績效得分總覽表</h1>
                <p class="text-indigo-200 text-xs mt-1">學期時間：2026/09/21 週 ~ 2026/12/28 週 | 姓名中間字自動遮蔽為 O</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="syncBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-xs px-4 py-2.5 rounded-lg shadow flex items-center gap-1.5 transition cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    同步 Google 試算表數據
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 space-y-6">

        <!-- 上方狀態與統計面板 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                <p class="text-xs text-slate-500 font-semibold">總追蹤人數</p>
                <p id="statTotalStudents" class="text-2xl font-bold text-slate-800 mt-1">0 人</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                <p class="text-xs text-slate-500 font-semibold">全班學期平均總得分</p>
                <p id="statAvgScore" class="text-2xl font-bold text-indigo-600 mt-1">0 分</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                <p class="text-xs text-slate-500 font-semibold">學期總週次</p>
                <p class="text-2xl font-bold text-emerald-600 mt-1">15 週</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center flex flex-col justify-center items-center">
                <span id="syncStatus" class="text-xs font-semibold text-slate-400">連線狀態</span>
                <span id="lastUpdated" class="text-xs text-slate-500 mt-1">未同步</span>
            </div>
        </div>

        <!-- 評分說明 -->
        <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 text-xs text-indigo-900 flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
            <div>
                <span class="font-bold text-indigo-800">💯 每週評分機制（滿分 10 分）：</span>
                <span>當週（平均每次 ≥ 2 小時 且 次數 ≥ 2 次）或（填報次數 ≥ 5 次）得 10 分，否則按比例四捨五入計算。</span>
            </div>
            <span class="text-indigo-600 font-mono text-xs">單元格顯示：0~10 分 (10分為綠色)</span>
        </div>

        <!-- 交叉得分矩陣表格 -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-slate-800">學生個人每週得分陣列 (成績單檢視)</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-center text-slate-600 border-collapse">
                    <thead id="tableHeader" class="text-xs text-slate-700 bg-slate-100 border-b border-slate-200">
                        <!-- 動態繪製表頭 -->
                    </thead>
                    <tbody id="recordsTableBody">
                        <tr>
                            <td id="loadingTd" colspan="17" class="text-center py-10 text-slate-400 text-sm">
                                正在讀取並計算 Google 試算表分數...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // CSV 發布網址
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTHSlUTV8_xDsK4WtfLxbzOj8OJtpn-3v1Re6Tm2KmbQmbrkPOYxAq8xrFQtKh1DAbsc9AiNCLbET_3/pub?gid=1717113032&single=true&output=csv';
        
        // 15 週的週一日期清單（以 2026/09/21 為首週）
        const WEEKS_LIST = [
            '2026-09-21', '2026-09-28', '2026-10-05', '2026-10-12',
            '2026-10-19', '2026-10-26', '2026-11-02', '2026-11-09',
            '2026-11-16', '2026-11-23', '2026-11-30', '2026-12-07',
            '2026-12-14', '2026-12-21', '2026-12-28'
        ];

        // 姓名去識別化函數 (中間字替換為 O)
        function maskName(str) {
            if (!str) return '無名氏';
            let name = str.trim();
            if (name.length <= 1) return name;
            if (name.length === 2) return name[0] + 'O';
            return name[0] + 'O' + name.substring(2);
        }

        // 計算日期落在哪一週的週一索引 (0 ~ 14)
        function getWeekIndex(dateStr) {
            if (!dateStr) return 0;
            let d = new Date(dateStr);
            if (isNaN(d.getTime())) return 0;

            let start = new Date(WEEKS_LIST[0] + 'T00:00:00');
            let diffDays = Math.floor((d.getTime() - start.getTime()) / (1000 * 3600 * 24));
            
            if (diffDays < 0) return 0; // 早於首週歸入第0週
            let weekIdx = Math.floor(diffDays / 7);
            return Math.min(weekIdx, WEEKS_LIST.length - 1);
        }

        // 評分邏輯 (滿分10分)
        function calculateScore(hours, count) {
            if (!count || count <= 0) return 0;
            const avgHours = hours / count;

            if ((avgHours >= 2 && count >= 2) || count >= 5) {
                return 10;
            }

            const ratioA = Math.min(count / 2, hours / 4);
            const ratioB = count / 5;
            const maxRatio = Math.max(ratioA, ratioB);

            return Math.min(10, Math.round(maxRatio * 10));
        }

        // 初始化表格標頭
        function renderTableHeader() {
            const thead = document.getElementById('tableHeader');
            let html = '<tr><th class="py-3 px-3 text-left bg-slate-200 border-r border-slate-300 font-bold sticky left-0 z-10 w-28">姓名</th>';
            
            WEEKS_LIST.forEach(w => {
                let parts = w.split('-');
                let label = `${parseInt(parts[1])}/${parseInt(parts[2])}週`;
                html += `<th class="py-3 px-2 font-semibold border-r border-slate-200 min-w-[65px]">${label}</th>`;
            });

            html += '<th class="py-3 px-3 font-bold bg-indigo-50 text-indigo-800 min-w-[70px]">學期平均</th></tr>';
            thead.innerHTML = html;
        }

        // 從 Google 試算表獲取 CSV
        function fetchCsvData() {
            document.getElementById('syncStatus').textContent = '讀取中...';
            document.getElementById('syncStatus').className = 'text-xs font-semibold text-amber-500';

            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processAndRender(results.data);

                    document.getElementById('syncStatus').textContent = '已同步';
                    document.getElementById('syncStatus').className = 'text-xs font-semibold text-emerald-600';
                    document.getElementById('lastUpdated').textContent = '最後更新：' + new Date().toLocaleTimeString();
                },
                error: function(err) {
                    console.error('CSV 讀取失敗:', err);
                    document.getElementById('syncStatus').textContent = '同步失敗';
                    document.getElementById('syncStatus').className = 'text-xs font-semibold text-rose-500';
                }
            });
        }

        // 核心資料轉換：將 row 轉換為 { name: [week0_score, week1_score, ...] }
        function processAndRender(rows) {
            // 結構：studentMap[maskedName][weekIdx] = { count, hours }
            let studentMap = {};

            rows.forEach(row => {
                let timeKey = Object.keys(row).find(k => k.includes('時間') || k.includes('Timestamp')) || Object.keys(row)[0];
                let nameKey = Object.keys(row).find(k => k.includes('姓名') || k.includes('Name')) || Object.keys(row)[1];
                let hourKey = Object.keys(row).find(k => k.includes('時數') || k.includes('工時') || k.includes('小時')) || Object.keys(row)[2];

                let timeVal = row[timeKey];
                let nameVal = maskName(row[nameKey]);
                let hourVal = parseFloat(row[hourKey]) || 0;

                let wIdx = getWeekIndex(timeVal);

                if (!studentMap[nameVal]) {
                    studentMap[nameVal] = Array(WEEKS_LIST.length).fill(null).map(() => ({ count: 0, hours: 0 }));
                }

                studentMap[nameVal][wIdx].count += 1;
                studentMap[nameVal][wIdx].hours += hourVal;
            });

            // 渲染至表格
            const tbody = document.getElementById('recordsTableBody');
            tbody.innerHTML = '';

            const studentNames = Object.keys(studentMap).sort();

            if (studentNames.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${WEEKS_LIST.length + 2}" class="text-center py-8 text-slate-400">目前尚無學生填報資料</td></tr>`;
                document.getElementById('statTotalStudents').textContent = '0 人';
                document.getElementById('statAvgScore').textContent = '0 分';
                return;
            }

            let classTotalScore = 0;
            let classTotalCount = 0;

            studentNames.forEach(name => {
                const weekArr = studentMap[name];
                let studentScoreSum = 0;

                let trHtml = `<tr class="border-b border-slate-200 hover:bg-slate-50 transition">`;
                trHtml += `<td class="py-2.5 px-3 text-left font-bold text-slate-800 bg-white border-r border-slate-200 sticky left-0 z-10">${name}</td>`;

                weekArr.forEach(item => {
                    const score = calculateScore(item.hours, item.count);
                    studentScoreSum += score;
                    classTotalScore += score;
                    classTotalCount++;

                    // 顏色分級
                    let bgStyle = 'text-slate-400';
                    if (score === 10) bgStyle = 'bg-emerald-100 text-emerald-800 font-bold';
                    else if (score >= 5) bgStyle = 'bg-amber-50 text-amber-700 font-semibold';
                    else if (score > 0) bgStyle = 'bg-rose-50 text-rose-600';

                    trHtml += `<td class="py-2.5 px-2 border-r border-slate-100 font-mono ${bgStyle}">${score}</td>`;
                });

                let studentAvg = (studentScoreSum / WEEKS_LIST.length).toFixed(1);
                trHtml += `<td class="py-2.5 px-3 font-bold text-indigo-700 bg-indigo-50/50 font-mono">${studentAvg}</td></tr>`;

                tbody.insertAdjacentHTML('beforeend', trHtml);
            });

            // 更新頁面統計數據
            document.getElementById('statTotalStudents').textContent = `${studentNames.length} 人`;
            document.getElementById('statAvgScore').textContent = classTotalCount ? `${(classTotalScore / classTotalCount).toFixed(1)} 分` : '0 分';
        }

        // 事件綁定
        document.getElementById('syncBtn').addEventListener('click', fetchCsvData);

        // 初始化
        renderTableHeader();
        fetchCsvData();
    </script>
</body>
</html>
