        // 狀態管理
        let currentSlide = 0;

        window.addEventListener('DOMContentLoaded', () => {
            initSelectOptions();
            renderDots();
            showSlide(currentSlide);

            // 鍵盤操控
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                    nextSlide();
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    prevSlide();
                }
            });
        });

        function initSelectOptions() {
            const select = document.getElementById('slide-select');
            select.innerHTML = '';
            slidesData.forEach((slide, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = slide.title;
                select.appendChild(opt);
            });
        }

        function renderDots() {
            const dotsContainer = document.getElementById('dots-container');
            dotsContainer.innerHTML = '';
            slidesData.forEach((_, idx) => {
                const dot = document.createElement('button');
                dot.className = `w-2.5 h-2.5 rounded-full transition-all ${idx === currentSlide ? 'bg-blue-500 w-6' : 'bg-slate-700 hover:bg-slate-500'}`;
                dot.onclick = () => goToSlide(idx);
                dotsContainer.appendChild(dot);
            });
        }

        function showSlide(index) {
            if (index < 0 || index >= slidesData.length) return;
            currentSlide = index;

            const container = document.getElementById('slide-container');
            container.innerHTML = slidesData[currentSlide].html;

            // UI 狀態更新
            document.getElementById('page-indicator').innerText = `${currentSlide + 1} / ${slidesData.length}`;
            document.getElementById('slide-title-preview').innerText = slidesData[currentSlide].title;
            document.getElementById('slide-select').value = currentSlide;

            document.getElementById('prev-btn').disabled = (currentSlide === 0);
            document.getElementById('next-btn').disabled = (currentSlide === slidesData.length - 1);

            renderDots();

            // 安全調用 MathJax
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([container]).catch((err) => console.error('MathJax Typeset Error:', err));
            }
        }

        function nextSlide() {
            if (currentSlide < slidesData.length - 1) {
                showSlide(currentSlide + 1);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                showSlide(currentSlide - 1);
            }
        }

        function goToSlide(index) {
            showSlide(index);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`無法切換全螢幕: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
